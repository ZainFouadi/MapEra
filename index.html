<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WarEra SR Planner</title><link rel="stylesheet" href="style.css?v=4">
</head><body>
<section id="login" class="card center">
  <h1>WarEra SR Planner</h1>
  <label>Login method
    <select id="auth-type"><option value="jwt">JWT</option><option value="token">In-game token</option><option value="none">No login (public data)</option></select></label>
  <input id="auth-value" type="password" placeholder="Paste token">
  <label>Country <select id="country"></select></label>
  <button id="go">Continue</button><div id="login-msg" class="msg"></div>
</section>
<main id="app" hidden>
  <header>
    <b id="title"></b>
    <input id="search" placeholder="Search region">
    <select id="f-res"><option value="">All resources</option></select>
    <label><input type="checkbox" id="f-claim"> Claimable only</label>
    <button id="reset">Reset</button><button id="diag">Diagnose</button><button id="logout">Logout</button>
  </header>
  <div id="status" class="msg"></div>
  <div class="layout">
    <svg id="map"></svg>
    <aside>
      <div id="bonus" class="card"></div>
      <div id="side" class="card">Click a region.</div>
    </aside>
  </div>
</main>
<button id="theme" class="fab"></button>
<dialog id="dlg"><textarea id="report" readonly></textarea><div><button id="copy">Copy</button><button id="close">Close</button></div></dialog>
<script src="config.js?v=4"></script><script src="calc.js?v=4"></script><script src="map.js?v=4"></script><script src="app.js?v=4"></script>
</body></html>
